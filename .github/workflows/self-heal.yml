# Self-heal caller - fires when a self-heal issue is labeled, and calls the
# central AI-fix pipeline in wagonworks-dev. Inert by default (SELF_HEAL_ENABLED).
name: self-heal
on:
  issues:
    types: [labeled]
jobs:
  heal:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    if: github.event.label.name == 'self-heal' && vars.SELF_HEAL_ENABLED == 'true'
    uses: TheLobbi/wagonworks-dev/.github/workflows/self-heal.yml@97ef1fb8b02e82d44800f27c814601adccbda6a2
    with:
      issue-number: ${{ github.event.issue.number }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
